name: Build Chrome extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build and package the extension
        run: npm run zip

      - name: Test the built extension
        run: npm run test:e2e

      - name: Verify package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $manifest = Get-Content -Raw dist/chrome-mv3/manifest.json | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "Manifest version $($manifest.version) does not match package version $version."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version."
          }
          $package = "dist/livechat-copilot-$version-chrome.zip"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "Missing Chrome extension ZIP: $package"
          }
          "path=$package" >> $env:GITHUB_OUTPUT

      - name: Upload Chrome ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
