<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="manifest.open_in_tab" content="true"><link rel="icon" href="/icons/logo.svg"><title>LiveChat Copilot 设置</title></head>
<body>
  <main class="options">
    <header class="brand"><img src="/icons/logo.svg" width="46" height="46" alt=""><h1>LiveChat Copilot <span>设置</span></h1></header>
    <form id="settings">
      <section>
        <h2>模型配置</h2>
        <div class="model-layout">
          <div>
            <label>API Base URL <input id="endpoint" type="url" required spellcheck="false"></label>
            <label>模型 ID <input id="model" required maxlength="150" spellcheck="false"></label>
            <label>API Key <input id="key" type="password" autocomplete="off" maxlength="2048"></label>
            <p class="secondary">密钥保存在本地。本地兼容服务可以留空。</p>
            <div class="actions model-actions">
              <button type="submit" class="primary" id="save-model">保存并授权</button>
              <button type="button" id="test">测试当前模型</button>
            </div>
            <p id="status" role="status"></p>
          </div>
          <aside class="model-test" aria-labelledby="test-title">
            <h3 id="test-title">测试结果</h3>
            <dl aria-live="polite">
              <div><dt>连接</dt><dd id="test-connection">待测试</dd></div>
              <div><dt>图片输入</dt><dd id="test-image">待测试</dd></div>
              <div><dt>单条翻译耗时</dt><dd id="test-latency">—</dd></div>
            </dl>
            <p class="secondary" id="test-detail">测试使用一条示例弹幕和一张合成图片。</p>
          </aside>
        </div>
        <div class="region-review">
          <label class="check"><input id="auto-vision" type="checkbox" disabled aria-describedby="review-help image-status"> 用截图核验新弹幕区</label>
          <p class="secondary" id="review-help">首次识别或重新选区时，将候选区域裁图和少量弹幕发给你配置的模型，帮你确认选区。已保存的规则直接复用。</p>
          <p class="secondary" id="image-status" role="status"></p>
        </div>
      </section>
      <section>
        <h2>翻译偏好</h2>
        <div class="field-row">
          <label>阅读语言 <input id="language" maxlength="48" spellcheck="false" aria-describedby="language-help">
            <small id="language-help" class="secondary">留空时跟随浏览器界面语言。</small>
          </label>
          <label>翻译方式 <select id="mode" aria-describedby="mode-help">
            <option value="batch">合并多条后自动翻译（推荐）</option>
            <option value="single">收到消息后逐条翻译</option>
            <option value="manual">点击哪条，就翻译哪条</option>
          </select>
            <small id="mode-help" class="secondary"></small>
          </label>
        </div>
        <label>翻译风格提示词 <textarea id="prompt" rows="3" maxlength="2000"></textarea></label>
        <div class="actions">
          <button type="submit" id="save-preferences" formnovalidate>保存翻译偏好</button>
          <button type="button" id="reset-prompt">恢复提示词</button>
        </div>
        <p id="preferences-status" role="status"></p>
      </section>
    </form>
    <section id="local-rule-panel" hidden>
      <h2>本地规则</h2>
      <ul id="local-rules"></ul>
      <p id="local-rule-status" role="status"></p>
    </section>
    <section>
      <h2>本地用量</h2>
      <p class="secondary">保留最近 30 天的汇总。诊断摘要只含计数和模型用量，由你决定是否分享。</p>
      <label>统计范围 <select id="usage-range"><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></label>
      <div id="usage"></div>
      <div class="actions">
        <button type="button" id="refresh-usage">刷新</button>
        <button type="button" id="export">预览诊断摘要</button>
        <button type="button" id="clear">清空</button>
      </div>
      <p id="usage-status" role="status"></p>
      <div id="diagnostic-preview" hidden>
        <label>诊断摘要 <textarea id="diagnostic" rows="10" readonly></textarea></label>
        <button type="button" id="copy">复制摘要</button>
      </div>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
